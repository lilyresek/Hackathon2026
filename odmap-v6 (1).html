<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>ODMAP — Drug Interaction Network</title>
<!-- D3 v7 (classic global; the 2D renderer + a few utilities use window.d3) -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<!-- 3D stack (classic UMD globals), modeled after vasturiano's 3d-force-graph:
     ThreeJS/WebGL + d3-force-3d. Plain <script> tags load reliably without needing
     import-map support or an ESM CDN. three-spritetext + our custom node objects
     use the same window.THREE loaded here. -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/three-spritetext@1.8.2/dist/three-spritetext.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<!-- Signal readiness for the app: these UMD scripts are synchronous, so by the
     time the body's app script runs the globals exist (or they failed to load,
     in which case the app gracefully stays in 2D). -->
<script>
  window.addEventListener("DOMContentLoaded",function(){
    window.__graphLibsReady = true;
    if(typeof ForceGraph3D==="undefined" || typeof THREE==="undefined"){
      window.__force3DUnavailable = true;
      console.warn("3D libraries not available — the app will run in 2D.");
    }
    document.dispatchEvent(new Event("graphlibsready"));
  });
</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f5f0e8;color:#2d3a2e;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}

  #header{background:#2d3a2e;border-bottom:2px solid #4a6741;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap}
  #header h1{font-size:1.15rem;color:#b8d4a8;letter-spacing:2px;font-weight:700;white-space:nowrap}
  #header .subtitle{font-size:.75rem;color:#7a9e72;white-space:nowrap}

  /* 2D / 3D segmented toggle */
  #view-toggle{display:inline-flex;border:1px solid #4a6741;border-radius:7px;overflow:hidden;flex-shrink:0}
  .vt-btn{background:#3d4f3e;color:#b8d4a8;border:none;padding:5px 12px;font-size:.78rem;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .vt-btn+.vt-btn{border-left:1px solid #4a6741}
  .vt-btn:hover{background:#4a6741}
  .vt-btn.active{background:#8fbe7c;color:#1d281e}

  #breadcrumb-wrap{flex:1;display:flex;align-items:center;overflow-x:auto;min-width:0;max-width:420px;scrollbar-width:thin;scrollbar-color:#4a6741 transparent}
  #breadcrumb-wrap::-webkit-scrollbar{height:3px}
  #breadcrumb-wrap::-webkit-scrollbar-thumb{background:#4a6741;border-radius:2px}
  #breadcrumb-inner{display:flex;align-items:center;white-space:nowrap}
  .bc-step{font-size:.75rem;color:#b8d4a8;cursor:pointer;padding:3px 7px;border-radius:4px}
  .bc-step:hover{background:#3d4f3e}
  .bc-step.current{color:#e8f0e4;font-weight:600;background:#4a6741;cursor:default}
  .bc-arrow{color:#7a9e72;font-size:.75rem;padding:0 2px;user-select:none}

  #saved-btn{background:#4a6741;border:1px solid #8fbe7c;color:#e8f0e4;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:600;white-space:nowrap;flex-shrink:0}
  #saved-btn:hover{background:#5a7d50}

  #search-area{display:flex;gap:8px;align-items:center;position:relative;flex-shrink:0}
  #search-area input{background:#3d4f3e;border:1px solid #4a6741;border-radius:6px;color:#e8f0e4;padding:5px 10px;font-size:.82rem;width:130px}
  #search-area input:focus{outline:none;border-color:#8fbe7c}
  #search-area input::placeholder{color:#7a9e72}
  #go-btn{background:#4a6741;border:none;color:#e8f0e4;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:600}
  #go-btn:hover{background:#5a7d50}

  #history-dropdown{display:none;position:absolute;top:100%;right:0;margin-top:4px;background:#2d3a2e;border:1px solid #4a6741;border-radius:8px;padding:8px 10px;z-index:1100;min-width:260px;box-shadow:0 4px 16px #0003}
  #history-dropdown .hist-label{font-size:.7rem;color:#7a9e72;margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.8px}
  .hist-chip{background:#3d4f3e;border:1px solid #4a6741;border-radius:12px;padding:3px 10px;font-size:.75rem;cursor:pointer;color:#b8d4a8;white-space:nowrap}
  .hist-chip:hover{background:#4a6741}

  /* ── Autocomplete dropdown (shared by both search inputs and the saved-list input) ── */
  .ac-dropdown{position:absolute;z-index:1300;background:#fff;border:1px solid #c5b99a;border-radius:8px;box-shadow:0 6px 20px #0003;max-height:230px;overflow-y:auto;min-width:150px;padding:4px;scrollbar-width:thin;scrollbar-color:#c5b99a transparent;display:none}
  .ac-dropdown::-webkit-scrollbar{width:6px}
  .ac-dropdown::-webkit-scrollbar-thumb{background:#c5b99a;border-radius:3px}
  .ac-item{padding:6px 10px;font-size:.82rem;color:#2d3a2e;border-radius:5px;cursor:pointer;display:flex;align-items:baseline;gap:7px;white-space:nowrap}
  .ac-item:hover,.ac-item.active{background:#e3eedd}
  .ac-item .ac-alt{font-size:.7rem;color:#8a7e6a}
  .ac-item .ac-match{font-weight:700;color:#2d6a22}
  .ac-empty{padding:7px 10px;font-size:.78rem;color:#8a7e6a}
  /* "Not in our list — add it?" confirmation popup */
  #adddrug-modal{position:fixed;inset:0;background:#2d3a2e55;z-index:2000;display:none;align-items:center;justify-content:center}
  #adddrug-box{background:#f0ebe0;border:1px solid #c5b99a;border-radius:12px;padding:20px 22px;max-width:340px;box-shadow:0 10px 40px #0005;text-align:center}
  #adddrug-box p{font-size:.9rem;color:#2d3a2e;line-height:1.5;margin-bottom:16px}
  #adddrug-box p b{color:#4a6741}
  .adddrug-btns{display:flex;gap:10px;justify-content:center}
  .adddrug-btn{padding:7px 20px;border-radius:7px;cursor:pointer;font-size:.85rem;font-weight:600;border:1px solid transparent}
  .adddrug-btn.yes{background:#4a6741;color:#e8f0e4}
  .adddrug-btn.yes:hover{background:#5a7d50}
  .adddrug-btn.no{background:#e8e0d0;color:#5a5040;border-color:#c5b99a}
  .adddrug-btn.no:hover{background:#ddd5c2}

  #search-result{position:fixed;top:56px;right:20px;background:#f0ebe0;border:1px solid #c5b99a;border-radius:8px;padding:14px 18px;z-index:999;display:none;max-width:320px;font-size:.85rem;line-height:1.6;color:#2d3a2e;box-shadow:0 4px 16px #0002}
  #search-result h3{color:#4a6741;margin-bottom:6px}
  #search-result .close-btn{float:right;cursor:pointer;color:#8a7e6a}

  #saved-panel{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#f0ebe0;border:1px solid #c5b99a;border-radius:10px;padding:16px 20px;z-index:1200;display:none;min-width:280px;max-width:360px;box-shadow:0 6px 24px #0003}
  #saved-panel h3{color:#4a6741;margin-bottom:10px;font-size:.95rem}
  #saved-panel .sp-close{float:right;cursor:pointer;color:#8a7e6a}
  #saved-input-row{display:flex;gap:8px;margin-bottom:8px}
  #saved-input{flex:1;background:#e8e0d0;border:1px solid #c5b99a;border-radius:6px;padding:5px 9px;font-size:.82rem;color:#2d3a2e}
  #saved-add-btn{background:#4a6741;border:none;color:#e8f0e4;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.82rem}
  #saved-add-btn:hover{background:#5a7d50}
  #saved-list-items{display:flex;flex-wrap:wrap;gap:6px;max-height:140px;overflow-y:auto}
  .saved-item{background:#d8eecf;border:1px solid #a0c896;border-radius:12px;padding:3px 10px;font-size:.78rem;color:#2d4a28;display:flex;align-items:center;gap:5px}
  .saved-item .si-remove{cursor:pointer;color:#c0392b;font-size:.85rem}

  #main{display:flex;flex:1;overflow:hidden}
  #graph-area{flex:1;position:relative}
  /* Two interchangeable graph hosts, stacked; only the active view is shown. */
  #graph3d{position:absolute;inset:0;background:#f5f0e8;transition:opacity .4s}
  #graph3d canvas{display:block}
  #graph2d{position:absolute;inset:0;width:100%;height:100%;display:none}
  /* keep the tiny legend swatch SVGs sized as before (no longer a global rule) */
  #legend svg{width:28px;height:10px}

  /* The right-hand panel is a vertical stack that can hold any number of cards
     (drug cards and/or an interaction card). Adjacent cards are separated by a
     draggable horizontal divider. Each card scrolls independently and has its
     own close button. The panel only shows when at least one card is open. */
  #info-panel{width:300px;background:#eee8d8;border-left:2px solid #c5b99a;padding:0;flex-shrink:0;display:none;flex-direction:column;overflow:hidden}
  .info-card{overflow-y:auto;display:flex;flex-direction:column;min-height:0;flex:1 1 0}
  .card-divider{flex:0 0 7px;height:7px;background:#c5b99a;cursor:row-resize;position:relative}
  .card-divider:hover{background:#a99d80}
  .card-divider::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:3px;border-radius:2px;background:#8a7e6a}
  .card-top-bar{display:flex;align-items:center;justify-content:flex-start;background:#ddd5c2;padding:8px 12px 0}
  .close-panel-btn-top{background:none;border:1px solid #c5b99a;border-radius:6px;color:#5a5040;padding:3px 9px;cursor:pointer;font-size:.78rem}
  .close-panel-btn-top:hover{background:#c5b99a;color:#2d3a2e}
  .card-header{background:#ddd5c2;padding:8px 18px 12px;border-bottom:1px solid #c5b99a}
  .card-brand{font-size:1.05rem;font-weight:700;color:#2d3a2e;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card-class{font-size:.75rem;color:#7a6e5a;margin-top:2px}
  .pronunc-btn{background:#f5f0e8;border:1px solid #c5b99a;border-radius:6px;color:#4a6741;cursor:pointer;padding:3px 8px;font-size:.75rem;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .pronunc-btn:hover{background:#ddd5c2}
  .ingredient-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
  .pronunc-btn.ingredient{font-size:.72rem;padding:2px 7px}
  .card-body{padding:12px 18px;flex:1}
  /* Thin divider line between each section inside a card (not above the first). */
  .card-section-title{font-size:.68rem;color:#7a6e5a;text-transform:uppercase;letter-spacing:1px;margin-top:12px;margin-bottom:3px;font-weight:600;border-top:1px solid #d5cbb3;padding-top:11px}
  .card-body > .card-section-title:first-child{border-top:none;padding-top:0;margin-top:0}
  /* Negative-interactions list: scrollable once it exceeds ~3 drug entries. */
  .icard-list{display:flex;flex-direction:column;gap:0}
  .icard-list.scroll{max-height:268px;overflow-y:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:#c5b99a transparent;border:1px solid #d5cbb3;border-radius:6px;background:#f7f2e8}
  .icard-list.scroll::-webkit-scrollbar{width:6px}
  .icard-list.scroll::-webkit-scrollbar-thumb{background:#c5b99a;border-radius:3px}
  .icard-list.scroll .icard:first-child{margin-top:7px}
  .card-val{font-size:.83rem;color:#2d3a2e;line-height:1.5}
  .similar-chip{display:inline-block;background:#d8eecf;border:1px solid #a0c896;border-radius:10px;padding:2px 9px;font-size:.74rem;color:#3a5e34;margin:2px 2px 2px 0;cursor:pointer}
  .similar-chip:hover{background:#c5e0ba}
  .icard{background:#f0ebe0;border-radius:6px;padding:7px 9px;margin-top:7px;border-left:3px solid #4a6741}
  .icard .ic-title{font-size:.78rem;font-weight:600;color:#2d3a2e;display:flex;align-items:center;gap:5px}
  .ic-badge{font-size:.66rem;padding:1px 6px;border-radius:8px;font-weight:700;text-transform:uppercase}
  .ic-badge.severe{background:#c0392b22;color:#c0392b;border:1px solid #c0392b55}
  .ic-badge.moderate{background:#d4860022;color:#b8720a;border:1px solid #d4860055}
  .ic-badge.mild{background:#27ae6022;color:#27ae60;border:1px solid #27ae6055}
  .icard.severe{border-left-color:#c0392b}
  .icard.moderate{border-left-color:#d48600}
  .icard.mild{border-left-color:#27ae60}
  .icard .ic-sub{font-size:.73rem;color:#5a5040;margin-top:3px;line-height:1.4}
  .src-link{font-size:.7rem;color:#4a6741;text-decoration:none;display:inline-flex;align-items:center;gap:3px;margin-top:3px}
  .src-link:hover{text-decoration:underline}
  /* "arrow out of box" external-link icon used on all links that open a new tab */
  .ext-ico{width:.72em;height:.72em;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-1px}

  /* Google-Maps-style horizontal photo gallery (thumbnails from Drugs.com) */
  .gallery{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin;scrollbar-color:#c5b99a transparent}
  .gallery::-webkit-scrollbar{height:6px}
  .gallery::-webkit-scrollbar-thumb{background:#c5b99a;border-radius:3px}
  .gphoto{flex:0 0 112px;width:112px;text-decoration:none;color:#2d3a2e}
  .gphoto .gthumb{width:112px;height:84px;border-radius:7px;border:1px solid #c5b99a;object-fit:cover;background:#f0ebe0;display:block}
  .gphoto .gthumb-fallback{width:112px;height:84px;border-radius:7px;border:1px dashed #b7a98a;background:#f0ebe0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.7rem;color:#8a7e6a;padding:4px;line-height:1.25}
  .gphoto:hover .gthumb,.gphoto:hover .gthumb-fallback{border-color:#4a6741;box-shadow:0 0 0 2px #4a674133}
  .gcap{font-size:.68rem;line-height:1.25;margin-top:4px;color:#3d3028}
  .gcap b{color:#2d3a2e}
  .gcap .gcap-sub{color:#7a6e5a}

  #legend{position:absolute;bottom:14px;left:14px;background:#f0ebe0cc;border:1px solid #c5b99a;border-radius:8px;padding:10px 14px;font-size:.71rem;line-height:1.9;backdrop-filter:blur(4px)}
  #legend .leg-title{color:#7a6e5a;margin-bottom:2px;font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.8px}
  .leg-row{display:flex;align-items:center;gap:7px;color:#3d3028}

  #tooltip{position:fixed;background:#2d3a2e;border:1px solid #4a6741;border-radius:6px;padding:6px 10px;font-size:.76rem;pointer-events:none;display:none;z-index:800;max-width:230px;line-height:1.5;color:#e8f0e4}
</style>
</head>
<body>

<div id="header">
  <h1>⬡ ODMAP</h1>
  <div class="subtitle">Drug Interaction Network</div>
  <div id="view-toggle" title="Switch between 2D and 3D layouts">
    <button id="vt-2d" class="vt-btn" onclick="setViewMode('2d')">2D</button>
    <button id="vt-3d" class="vt-btn active" onclick="setViewMode('3d')">3D</button>
  </div>
  <div id="breadcrumb-wrap"><div id="breadcrumb-inner"></div></div>
  <button id="saved-btn" onclick="toggleSavedPanel()">💊 Saved List</button>
  <div id="search-area">
    <input id="drug1" placeholder="Drug 1" autocomplete="off"/>
    <input id="drug2" placeholder="Drug 2" autocomplete="off"/>
    <button id="go-btn" onclick="searchInteraction()">Go</button>
    <div id="history-dropdown">
      <span class="hist-label">Search History</span>
      <div class="hist-chips" id="hist-chips-container"></div>
    </div>
  </div>
</div>

<div id="saved-panel">
  <span class="sp-close" onclick="toggleSavedPanel()">✕</span>
  <h3>💊 My Saved Prescriptions</h3>
  <div id="saved-input-row">
    <input id="saved-input" placeholder="Add drug name…" autocomplete="off"/>
    <button id="saved-add-btn" onclick="addToSaved()">Add</button>
  </div>
  <div id="saved-list-items"></div>
</div>

<div id="search-result">
  <span class="close-btn" onclick="this.parentElement.style.display='none'">✕</span>
  <h3 id="sr-title"></h3>
  <div id="sr-body"></div>
</div>

<div id="adddrug-modal">
  <div id="adddrug-box">
    <p id="adddrug-msg"></p>
    <div class="adddrug-btns">
      <button class="adddrug-btn yes" id="adddrug-yes">Yes</button>
      <button class="adddrug-btn no" id="adddrug-no">No</button>
    </div>
  </div>
</div>

<div id="main">
  <div id="graph-area">
    <div id="graph3d"></div>
    <svg id="graph2d"></svg>
    <div id="legend">
      <div class="leg-title">Severity <span style="text-transform:none;font-weight:400;color:#8a7e6a">(color only)</span></div>
      <div class="leg-row"><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#c0392b" stroke-width="2.5"/></svg> Severe</div>
      <div class="leg-row"><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#d48600" stroke-width="2.5"/></svg> Moderate</div>
      <div class="leg-row"><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#27ae60" stroke-width="2.5"/></svg> Mild</div>
      <div class="leg-title" style="margin-top:8px">Interaction Type</div>
      <div class="leg-row"><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#5a5040" stroke-width="2"/></svg> Hematologic</div>
      <div class="leg-row"><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#5a5040" stroke-width="2" stroke-dasharray="8,4"/></svg> Metabolic</div>
      <div class="leg-row"><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#5a5040" stroke-width="2" stroke-dasharray="4,2"/></svg> Cardiovascular</div>
      <div class="leg-row"><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#5a5040" stroke-width="2" stroke-dasharray="2,5"/></svg> Neurological</div>
      <div class="leg-title" style="margin-top:8px">Saved List</div>
      <div class="leg-row"><svg width="28" height="10"><circle cx="14" cy="5" r="4" fill="none" stroke="#a855f7" stroke-width="2.5"/></svg> Conflicts w/ saved</div>
    </div>
  </div>
  <div id="info-panel"></div>
</div>
<div id="tooltip"></div>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────────────
// Description citations point to the drug's StatPearls monograph on the NLM
// NCBI Bookshelf (ncbi.nlm.nih.gov/books/…) — a peer-reviewed, reputable
// National Library of Medicine source. Every NBK ID below was verified to
// resolve to the correct drug monograph (Oct 2026).
const ALL_DRUGS = {
  "Warfarin":   {ingredient:"Warfarin sodium",        pronounce:"WAR-fuh-rin",     cls:"Anticoagulant",        similar:["Coumadin","Jantoven"],               citation:"https://www.ncbi.nlm.nih.gov/books/NBK470313/",  desc:"Prevents blood clots by inhibiting Vitamin K-dependent clotting factors."},
  "Aspirin":    {ingredient:"Acetylsalicylic acid",   pronounce:"AS-pir-in",       cls:"NSAID / Antiplatelet", similar:["Bayer","Bufferin","Ecotrin"],         citation:"https://www.ncbi.nlm.nih.gov/books/NBK519032/",  desc:"Reduces pain, fever, and platelet aggregation."},
  "Lipitor":    {ingredient:"Atorvastatin",           pronounce:"LIP-ih-tor",      cls:"Statin",               similar:["Torvast"],                           citation:"https://www.ncbi.nlm.nih.gov/books/NBK430779/",  desc:"Lowers LDL cholesterol by inhibiting HMG-CoA reductase."},
  "Paxil":      {ingredient:"Paroxetine",             pronounce:"PAX-il",          cls:"SSRI",                 similar:["Pexeva","Brisdelle"],                citation:"https://www.ncbi.nlm.nih.gov/books/NBK526022/",  desc:"Selective serotonin reuptake inhibitor for depression and anxiety."},
  "Prozac":     {ingredient:"Fluoxetine",             pronounce:"PRO-zak",         cls:"SSRI",                 similar:["Sarafem","Rapiflux"],                citation:"https://www.ncbi.nlm.nih.gov/books/NBK459223/",  desc:"Increases serotonin levels; treats depression and OCD."},
  "Xanax":      {ingredient:"Alprazolam",             pronounce:"ZAN-ax",          cls:"Benzodiazepine",       similar:["Niravam","Alprazolam ER"],           citation:"https://www.ncbi.nlm.nih.gov/books/NBK538165/",  desc:"Short-term management of anxiety disorders."},
  "Metformin":  {ingredient:"Metformin HCl",          pronounce:"met-FOR-min",     cls:"Biguanide",            similar:["Glucophage","Fortamet","Glumetza"],  citation:"https://www.ncbi.nlm.nih.gov/books/NBK518983/",  desc:"First-line treatment for type 2 diabetes; reduces hepatic glucose output."},
  "Lisinopril": {ingredient:"Lisinopril",             pronounce:"lye-SIN-oh-pril", cls:"ACE Inhibitor",        similar:["Zestril","Prinivil","Qbrelis"],      citation:"https://www.ncbi.nlm.nih.gov/books/NBK482230/",  desc:"Treats high blood pressure and heart failure."},
  "Advil":      {ingredient:"Ibuprofen",              pronounce:"AD-vil",          cls:"NSAID",                similar:["Motrin","Nuprin","Ibuprofen"],       citation:"https://www.ncbi.nlm.nih.gov/books/NBK542299/",  desc:"Reduces inflammation, pain, and fever."},
  "Amoxil":     {ingredient:"Amoxicillin trihydrate", pronounce:"a-MOX-il",        cls:"Antibiotic",           similar:["Trimox","Moxatag","Amoxicillin"],    citation:"https://www.ncbi.nlm.nih.gov/books/NBK482250/",  desc:"Broad-spectrum penicillin antibiotic."},

// ─── STATE ────────────────────────────────────────────────────────────────────
let currentRoot   = "Warfarin";
let clickTrail    = [];
let history       = [];
let savedList     = [];
let isInteracting = false;
let idleTimeout   = null;
let currentNodes  = [];
let viewMode      = "3d";   // "3d" (ThreeJS) | "2d" (D3/SVG) — toggled from header
// position caches: remember where nodes were so rebuilds animate FROM last
// position. Kept per-mode so 2D screen coords never mix with 3D-space coords.
let posCache      = {};   // 2D: { drugName: {x, y} }  (screen coords)
let posCache3D    = {};   // 3D: { drugName: {x, y, z} } (world coords)

// ─── NAME RESOLUTION ───────────────────────────────────────────────────────────
// Resolve any user-typed name to a canonical drug key. Matches (case-insensitively):
//   1. the canonical brand key itself (e.g. "Warfarin")
//   2. any alternative/brand name in that drug's `similar` list (e.g. "Coumadin")
//   3. the active ingredient (e.g. "Warfarin sodium")
// Returns the canonical key, or null if nothing matches.
function resolveDrugName(input){
  if(!input)return null;
  const q=input.trim().toLowerCase();
  if(!q)return null;
  // 1. exact canonical key
  const keyExact=Object.keys(ALL_DRUGS).find(k=>k.toLowerCase()===q);
  if(keyExact)return keyExact;
  // 2. alternative brand name (same medication, different name)
  const bySimilar=Object.keys(ALL_DRUGS).find(k=>
    (ALL_DRUGS[k].similar||[]).some(s=>s.toLowerCase()===q));
  if(bySimilar)return bySimilar;
  // 3. active ingredient match
  const byIngredient=Object.keys(ALL_DRUGS).find(k=>
    (ALL_DRUGS[k].ingredient||"").toLowerCase()===q);
  if(byIngredient)return byIngredient;
  return null;
}

// ─── AUTOCOMPLETE ──────────────────────────────────────────────────────────────
// Master list of selectable drug names: canonical brand keys + all alternative
// names + the active ingredients, plus any names the user chooses to add. Kept
// sorted alphabetically (case-insensitive) and deduped.
let userAddedDrugs = [];   // names the user added via the "not in our list" prompt
function allDrugNames(){
  const set=new Map();   // lowercased -> display name (first seen wins)
  const add=n=>{ if(n && !set.has(n.toLowerCase())) set.set(n.toLowerCase(), n); };
  Object.keys(ALL_DRUGS).forEach(k=>{
    add(k);
    (ALL_DRUGS[k].similar||[]).forEach(add);
    if(ALL_DRUGS[k].ingredient) add(ALL_DRUGS[k].ingredient);
  });
  userAddedDrugs.forEach(add);
  return [...set.values()].sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
}
function isKnownDrugName(name){
  if(!name)return false;
  const q=name.trim().toLowerCase();
  return allDrugNames().some(n=>n.toLowerCase()===q);
}

// Attach an autocomplete dropdown to a text input.
//  onPick(value) runs when the user selects/commits a name.
function attachAutocomplete(input, onPick){
  const drop=document.createElement("div");
  drop.className="ac-dropdown";
  document.body.appendChild(drop);
  let items=[], active=-1;

  function position(){
    const r=input.getBoundingClientRect();
    drop.style.left=r.left+"px";
    drop.style.top=(r.bottom+4)+"px";
    drop.style.minWidth=r.width+"px";
  }
  function matches(q){
    const names=allDrugNames();
    if(!q) return names;                               // show full list when empty
    const ql=q.toLowerCase();
    // Prefer prefix matches, then substring matches; keep alphabetical within each.
    const starts=names.filter(n=>n.toLowerCase().startsWith(ql));
    const contains=names.filter(n=>!n.toLowerCase().startsWith(ql)&&n.toLowerCase().includes(ql));
    return [...starts,...contains];
  }
  function hl(name,q){
    if(!q) return name;
    const i=name.toLowerCase().indexOf(q.toLowerCase());
    if(i<0) return name;
    return name.slice(0,i)+`<span class="ac-match">${name.slice(i,i+q.length)}</span>`+name.slice(i+q.length);
  }
  // For an alternative name, note which DB drug it maps to (shown as a hint).
  function altHint(name){
    const key=resolveDrugName(name);
    return (key && key.toLowerCase()!==name.toLowerCase()) ? `→ ${key}` : "";
  }
  function render(){
    const q=input.value.trim();
    items=matches(q); active=-1;
    if(!items.length){
      drop.innerHTML=`<div class="ac-empty">No match — press Enter to add “${q}”</div>`;
    }else{
      drop.innerHTML=items.map((n,i)=>
        `<div class="ac-item" data-i="${i}"><span>${hl(n,q)}</span><span class="ac-alt">${altHint(n)}</span></div>`
      ).join("");
      [...drop.querySelectorAll(".ac-item")].forEach(el=>{
        el.addEventListener("mousedown",e=>{ e.preventDefault(); commit(items[+el.dataset.i]); });
      });
    }
    position(); drop.style.display="block";
  }
  function setActive(i){
    const els=[...drop.querySelectorAll(".ac-item")];
    if(!els.length)return;
    active=(i+els.length)%els.length;
    els.forEach((el,j)=>el.classList.toggle("active",j===active));
    els[active].scrollIntoView({block:"nearest"});
  }
  function close(){ drop.style.display="none"; active=-1; }
  function commit(value){ input.value=value; close(); if(onPick) onPick(value); }

  input.addEventListener("focus",render);
  input.addEventListener("input",render);
  input.addEventListener("keydown",e=>{
    if(drop.style.display==="none")return;
    if(e.key==="ArrowDown"){e.preventDefault();setActive(active+1);}
    else if(e.key==="ArrowUp"){e.preventDefault();setActive(active-1);}
    else if(e.key==="Enter"){
      if(active>=0 && items[active]){
        // Selecting a highlighted suggestion just fills the field (doesn't also
        // fire the search / add action) so the user can finish the other field.
        e.preventDefault(); e.stopPropagation(); commit(items[active]);
      }
      // else: let the input's own Enter handler run (search / add-to-saved),
      // which will trigger the "not in our list" prompt if unknown.
    }
    else if(e.key==="Escape"){ close(); }
  });
  input.addEventListener("blur",()=>setTimeout(()=>{ if(!drop.matches(":hover")) close(); },120));
  window.addEventListener("resize",()=>{ if(drop.style.display==="block") position(); });
  return { close, refresh:render };
}

// "This drug isn't in our list. Add it?" confirmation popup. Returns a Promise<boolean>.
function confirmAddDrug(name){
  return new Promise(resolve=>{
    const modal=document.getElementById("adddrug-modal");
    document.getElementById("adddrug-msg").innerHTML=
      `This drug <b>“${name}”</b> isn’t in our list.<br/>Add it to the list?`;
    modal.style.display="flex";
    const yes=document.getElementById("adddrug-yes"), no=document.getElementById("adddrug-no");
    function cleanup(result){
      modal.style.display="none";
      yes.onclick=null; no.onclick=null;
      resolve(result);
    }
    yes.onclick=()=>{
      if(!userAddedDrugs.some(n=>n.toLowerCase()===name.toLowerCase())) userAddedDrugs.push(name);
      cleanup(true);
    };
    no.onclick=()=>cleanup(false);
  });
}

// ─── SAVED LIST ───────────────────────────────────────────────────────────────
function toggleSavedPanel(){const p=document.getElementById("saved-panel");p.style.display=p.style.display==="block"?"none":"block";}
function addToSaved(){
  const inp=document.getElementById("saved-input"),val=inp.value.trim();
  if(!val||savedList.includes(val))return;
  // If the name isn't in our drug list, ask whether to add it to the list first.
  if(!isKnownDrugName(val)){
    confirmAddDrug(val).then(added=>{
      if(!added)return;                 // "No" → don't save an unknown drug
      savedList.push(val);renderSavedList();refreshGraph();inp.value="";
    });
    return;
  }
  savedList.push(val);renderSavedList();refreshGraph();inp.value="";
}
function removeFromSaved(name){savedList=savedList.filter(s=>s!==name);renderSavedList();refreshGraph();}
function renderSavedList(){
  const c=document.getElementById("saved-list-items");c.innerHTML="";
  savedList.forEach(name=>{
    const el=document.createElement("div");el.className="saved-item";
    el.innerHTML=`${name}<span class="si-remove" onclick="removeFromSaved('${name}')">✕</span>`;
    c.appendChild(el);
  });
}
function conflictsWithSaved(drugName){
  return savedList.some(saved=>{
    const n=saved.toLowerCase();
    return ALL_INTERACTIONS.some(e=>
      (e.source.toLowerCase()===drugName.toLowerCase()&&e.target.toLowerCase()===n)||
      (e.target.toLowerCase()===drugName.toLowerCase()&&e.source.toLowerCase()===n)
    );
  });
}
function refreshGraph(){buildGraph(currentRoot,true);}
document.getElementById("saved-input").addEventListener("keydown",e=>{if(e.key==="Enter")addToSaved();});

// ─── PRONUNCIATION ─────────────────────────────────────────────────────────────
function pronounce(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.rate=0.85;u.lang="en-US";
  window.speechSynthesis.speak(u);
}

// ─── IDLE SPHERICAL ROTATION ───────────────────────────────────────────────────
// In 3D the idle motion is an OrbitControls auto-rotate: the camera orbits the
// node cloud on a sphere (replacing the old 2D in-plane spin). Active user input
// pauses the auto-rotate for a few seconds (same 3s idle window as before).
function startRotation(){
  const ctrls=Graph3D && Graph3D.controls && Graph3D.controls();
  if(ctrls){ ctrls.autoRotate=true; ctrls.autoRotateSpeed=0.55; }
}
function resetIdle(){
  isInteracting=true;clearTimeout(idleTimeout);
  const ctrls=Graph3D && Graph3D.controls && Graph3D.controls();
  if(ctrls) ctrls.autoRotate=false;                 // pause orbit while interacting
  idleTimeout=setTimeout(()=>{
    isInteracting=false;
    const c=Graph3D && Graph3D.controls && Graph3D.controls();
    if(c) c.autoRotate=true;                         // resume spherical idle orbit
  },3000);

document.addEventListener("mousemove",resetIdle);
document.addEventListener("mousedown",resetIdle);

// ─── GRAPH BUILDER ────────────────────────────────────────────────────────────
function buildGraph(rootName,silent=false){
  if(!silent){if(clickTrail[clickTrail.length-1]!==rootName)clickTrail.push(rootName);}
  if(history[history.length-1]!==rootName)history.push(rootName);
  currentRoot=rootName;
  updateBreadcrumb();

  const relEdges=ALL_INTERACTIONS.filter(e=>e.source===rootName||e.target===rootName);
  const neighborNames=new Set([rootName]);
  relEdges.forEach(e=>{neighborNames.add(e.source);neighborNames.add(e.target);});

  const nodes=[...neighborNames].map(n=>{
    const d=ALL_DRUGS[n]||{ingredient:"Unknown",pronounce:n,cls:"Unknown",similar:[],citation:"",desc:""};
    return {id:n,isRoot:n===rootName,ingredient:d.ingredient,pronounce:d.pronounce,
            cls:d.cls,similar:d.similar,citation:d.citation,desc:d.desc};
  });
  currentNodes=nodes;

  const links=relEdges.map(e=>({source:e.source,target:e.target,severity:e.severity,type:e.type,desc:e.desc,citation:e.citation}));

  // Decide which renderer to use. 3D needs the ES-module libraries to be ready;
  // if they aren't (still loading, or failed), fall back to the 2D renderer so
  // the app is never stuck on an empty/broken view.
  const want3D = viewMode==="3d";
  const can3D  = typeof ForceGraph3D!=="undefined" && typeof window.THREE!=="undefined" && !window.__force3DUnavailable;
  if(want3D && can3D){
    try{ render3D(nodes,links,rootName); }
    catch(err){ console.error("3D render failed; falling back to 2D.",err); forceFallbackTo2D(); render2D(nodes,links,rootName); }
  }else{
    // Show the 2D host while in (or falling back to) 2D.
    document.getElementById("graph2d").style.display="block";
    document.getElementById("graph3d").style.display="none";
    render2D(nodes,links,rootName);
  }
}

// Permanently drop to 2D (used when 3D is unavailable or errors). Updates the
// toggle UI and disables the 3D button so the user isn't sent back to a broken view.
function forceFallbackTo2D(){
  viewMode="2d";
  window.__force3DUnavailable=true;
  const b2=document.getElementById("vt-2d"), b3=document.getElementById("vt-3d");
  if(b2) b2.classList.add("active");
  if(b3){ b3.classList.remove("active"); b3.disabled=true; b3.title="3D unavailable (libraries didn’t load)"; b3.style.opacity="0.5"; b3.style.cursor="not-allowed"; }
  document.getElementById("graph2d").style.display="block";
  document.getElementById("graph3d").style.display="none";
}

// ─── VIEW MODE TOGGLE (2D ↔ 3D) ────────────────────────────────────────────────
function setViewMode(mode){
  if(mode===viewMode){ return; }
  // Guard: don't switch into 3D if the 3D libraries aren't available.
  if(mode==="3d" && (typeof ForceGraph3D==="undefined" || typeof window.THREE==="undefined" || window.__force3DUnavailable)){
    if(!window.__graphLibsReady){ /* still loading — allow, buildGraph will wait */ }
    else { console.warn("3D libraries unavailable — staying in 2D."); return; }
  }
  viewMode=mode;
  document.getElementById("vt-2d").classList.toggle("active", mode==="2d");
  document.getElementById("vt-3d").classList.toggle("active", mode==="3d");
  document.getElementById("graph2d").style.display = mode==="2d" ? "block" : "none";
  document.getElementById("graph3d").style.display = mode==="3d" ? "block" : "none";
  if(mode==="3d" && Graph3D && Graph3D.resumeAnimation) Graph3D.resumeAnimation();
  if(mode==="2d" && Graph3D && Graph3D.pauseAnimation)  Graph3D.pauseAnimation();
  buildGraph(currentRoot, true);
}

// ─── 2D FORCE-GRAPH (D3 / SVG) — the original renderer, used in "2D" mode ───────
let simulation2D = null;
let rotationTimer = null;   // 2D idle in-plane spin
function render2D(nodes,links,rootName){
  const svgEl=document.getElementById("graph2d");
  const W=svgEl.clientWidth||document.getElementById("graph-area").clientWidth;
  const H=svgEl.clientHeight||document.getElementById("graph-area").clientHeight;
  const cx=W/2,cy=H/2;

  // Start positions from cache (carry nodes over), new nodes near center.
  nodes.forEach(n=>{
    if(posCache[n.id]&&posCache[n.id].x!=null){n.x=posCache[n.id].x;n.y=posCache[n.id].y;}
    else{n.x=cx+(Math.random()-.5)*30;n.y=cy+(Math.random()-.5)*30;}
    if(n.isRoot){n.fx=cx;n.fy=cy;}
  });

  const svg=d3.select("#graph2d");
  // Cross-fade: keep only the latest old scene, fade it out, fade new in.
  const scenes=svg.selectAll("g.scene").nodes();
  scenes.slice(0,-1).forEach(el=>el.remove());
  const oldG=scenes.length?d3.select(scenes[scenes.length-1]):d3.select(null);
  const isTransition=!oldG.empty();
  const g=svg.append("g").attr("class","scene").attr("opacity",isTransition?0:1);
  svg.call(d3.zoom().scaleExtent([0.25,3]).on("zoom",e=>g.attr("transform",e.transform)));

  if(simulation2D)simulation2D.stop();
  simulation2D=d3.forceSimulation(nodes)
    .force("link",d3.forceLink(links).id(d=>d.id).distance(175).strength(0.55))
    .force("charge",d3.forceManyBody().strength(-480))
    .force("center",d3.forceCenter(cx,cy))
    .force("collision",d3.forceCollide(52))
    .velocityDecay(0.55).alphaDecay(0.03);

  const EDGE_WIDTH=2.5;
  const dashArray=t=>t==="Hematologic"?"none":t==="Metabolic"?"10,4":t==="Cardiovascular"?"5,3":"2,5";

  const linkG=g.append("g").selectAll("g.edge").data(links).join("g").attr("class","edge")
    .attr("cursor","pointer").attr("opacity",0)
    .on("click",(event,d)=>{event.stopPropagation();resetIdle();showInteractionCard(d);})
    .on("mouseover",(event,d)=>showTooltip(event,
      `<b>${d.source.id||d.source} ↔ ${d.target.id||d.target}</b><br/>
       <span style="color:#b8d4a8">${d.severity.toUpperCase()} · ${d.type}</span><br/>${d.desc}
       <br/><span style="color:#8fbe7c;font-size:.72rem">Click line for full details</span>`))
    .on("mouseout",hideTooltip);
  linkG.append("line").attr("stroke","transparent").attr("stroke-width",14);
  const linkSel=linkG.append("line")
    .attr("stroke",d=>edgeColor(d.severity)).attr("stroke-width",EDGE_WIDTH)
    .attr("stroke-dasharray",d=>dashArray(d.type)).attr("pointer-events","none");

  const nodeG=g.append("g").selectAll("g").data(nodes).join("g")
    .attr("cursor","pointer").attr("opacity",0)
    .call(d3.drag()
      .on("start",(event,d)=>{resetIdle();if(!event.active)simulation2D.alphaTarget(.4).restart();d.fx=d.x;d.fy=d.y;})
      .on("drag",(event,d)=>{d.fx=event.x;d.fy=event.y;})
      .on("end",(event,d)=>{if(!event.active)simulation2D.alphaTarget(0);if(!d.isRoot){d.fx=null;d.fy=null;}}))
    .on("click",(event,d)=>{event.stopPropagation();resetIdle();if(d.isRoot)showInfoCard(d);else buildGraph(d.id);})
    .on("mouseover",(event,d)=>showTooltip(event,
      `<b>${d.id}</b><br/><span style="color:#b8d4a8">${d.ingredient}</span><br/>
       <span style="color:#8fbe7c;font-size:.72rem">Click to ${d.isRoot?'see info card':'explore'}</span>`))
    .on("mouseout",hideTooltip);

  nodeG.append("circle")
    .attr("r",d=>d.isRoot?30:21)
    .attr("fill",d=>nodeColor(d))
    .attr("stroke",d=>nodeRingColor(d))
    .attr("stroke-width",d=>conflictsWithSaved(d.id)?3:d.isRoot?3:1.5);

  nodeG.append("text")
    .attr("text-anchor","middle").attr("dy","0.35em")
    .attr("font-size",d=>d.isRoot?"11px":"9.5px")
    .attr("fill",d=>d.isRoot?"#e8f0e4":"#2d3a2e")
    .attr("font-weight",d=>d.isRoot?"700":"400")
    .attr("pointer-events","none")
    .text(d=>d.id.length>10?d.id.slice(0,9)+"…":d.id);

  simulation2D.on("tick",()=>{
    nodes.forEach(n=>{posCache[n.id]={x:n.x,y:n.y};});
    linkG.selectAll("line")
      .attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
      .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    nodeG.attr("transform",d=>`translate(${d.x},${d.y})`);
  });

  const FADE_MS=400;
  if(isTransition){
    oldG.transition().duration(FADE_MS).attr("opacity",0).on("end",function(){d3.select(this).remove();});
    g.transition().duration(FADE_MS).delay(FADE_MS*0.5).attr("opacity",1);
    linkG.transition().duration(500).delay(FADE_MS*0.6).attr("opacity",.82);
    nodeG.transition().duration(500).delay(FADE_MS*0.7).attr("opacity",1);
  }else{
    g.attr("opacity",1);
    linkG.transition().duration(400).attr("opacity",.82);
    nodeG.transition().duration(400).attr("opacity",1);
  }
  setTimeout(()=>{const r=nodes.find(n=>n.isRoot);if(r){r.fx=null;r.fy=null;}},1200);
  start2DRotation();
}

// 2D idle rotation (in-plane spin), mirroring the original behavior.
function start2DRotation(){
  if(rotationTimer)return;
  rotationTimer=setInterval(()=>{
    if(viewMode!=="2d"||isInteracting||!currentNodes.length)return;
    const W=document.getElementById("graph-area").clientWidth;
    const H=document.getElementById("graph-area").clientHeight;
    const cx=W/2,cy=H/2;
    currentNodes.forEach(n=>{
      if(n.x==null)return;
      const dx=n.x-cx,dy=n.y-cy,r=Math.sqrt(dx*dx+dy*dy),a=Math.atan2(dy,dx)+0.003;
      n.x=cx+r*Math.cos(a);n.y=cy+r*Math.sin(a);
    });
    if(simulation2D)simulation2D.alpha(0.05).restart();
  },40);
}

// ─── 3D FORCE-GRAPH (ThreeJS/WebGL + d3-force-3d) ──────────────────────────────
// Modeled after vasturiano's react-force-graph / 3d-force-graph: nodes lay out
// and move in a 3D spherical space via the d3-force-3d engine, rendered with
// ThreeJS. All prior behavior is preserved — click a node to explore / open its
// info card, click a link for the interaction card, hover tooltips, the purple
// "conflicts with saved" ring, severity-colored links, and the root pinned at the
// scene center on each rebuild, then released to drift.
let Graph3D = null;

// Visual encodings carried over verbatim from the 2D version.
const edgeColor = s => s==="severe" ? "#c0392b" : s==="moderate" ? "#d48600" : "#27ae60";
// Interaction type was shown via dash pattern in 2D; in 3D (solid tubes) we keep
// severity = COLOR, and encode type as a subtle link-width tier so the mapping
// survives. Colors/severity meaning are unchanged.
const typeWidth = t => t==="Hematologic" ? 1.1 : t==="Metabolic" ? 0.9 : t==="Cardiovascular" ? 0.7 : 0.5;

function nodeColor(d){ return d.isRoot ? "#4a6741" : "#ddd5c2"; }
function nodeRingColor(d){ return conflictsWithSaved(d.id) ? "#a855f7" : d.isRoot ? "#8fbe7c" : "#a09080"; }
function nodeRadius(d){ return d.isRoot ? 10 : 6; }   // 3D sphere radius

// Track wireframe bubbles (to spin them) and labels (to keep them readable at
// any camera distance) each frame.
let _spinBubbles = [];
let _labels = [];

// Always-visible node label, bigger than the 2D text for readability. We keep
// three-spritetext's default sizeAttenuation=ON (disabling it makes the sprite
// render enormous/broken), and just use a larger textHeight. depthWrite off so
// labels aren't hidden inside their own node sphere.
function makeLabel(text, opts){
  if(typeof window.SpriteText==="undefined") return null;
  const s=new window.SpriteText(text);
  s.color = opts.color;
  s.textHeight = opts.textHeight;            // larger than the old 2D text
  s.fontWeight = opts.weight || "400";
  s.fontFace = "Segoe UI, sans-serif";
  s.backgroundColor = "rgba(245,240,232,0.72)";  // soft plate for legibility on any bg
  s.padding = 0.6;
  s.borderRadius = 2;
  if(s.material){ s.material.depthWrite=false; }
  return s;
}

// Wireframe "globe" bubble for the CENTRAL node — meridian rings + latitude rings
// + two polar axes, modeled on the provided CSS sphere. Slowly self-rotates.
function makeWireframeSphere(R, color, accent){
  const THREE=window.THREE;
  const group=new THREE.Group();
  const lineMat =new THREE.LineBasicMaterial({color:color,  transparent:true, opacity:0.55});
  const latMat  =new THREE.LineBasicMaterial({color:accent, transparent:true, opacity:0.4});

  // Helper: a circle (LineLoop) of radius r in the XY plane.
  function circle(r, segments, mat){
    const pts=[];
    for(let i=0;i<=segments;i++){ const a=(i/segments)*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*r, Math.sin(a)*r, 0)); }
    return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), mat);
  }

  // Meridians: full great circles rotated around the Y axis (18 of them, 10° apart).
  for(let i=0;i<18;i++){
    const m=circle(R, 64, lineMat);
    m.rotation.y=(i/18)*Math.PI;    // spread 0..180° (the back halves overlap)
    group.add(m);
  }
  // Latitudes: parallels at varying heights (smaller circles stacked along Y).
  const bands=6;
  for(let i=1;i<bands;i++){
    const phi=(i/bands)*Math.PI - Math.PI/2;   // -90°..+90°
    const r=Math.cos(phi)*R, y=Math.sin(phi)*R;
    const lat=circle(r, 48, latMat);
    lat.rotation.x=Math.PI/2;      // lay flat (parallel to the equator plane)
    lat.position.y=y;
    group.add(lat);
  }
  // Polar axis (a line through both poles) + a faint translucent core sphere.
  const axisPts=[new THREE.Vector3(0,-R*1.18,0), new THREE.Vector3(0,R*1.18,0)];
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(axisPts),
            new THREE.LineBasicMaterial({color:accent, transparent:true, opacity:0.5})));
  const core=new THREE.Mesh(new THREE.SphereGeometry(R*0.96, 24, 18),
            new THREE.MeshLambertMaterial({color:color, transparent:true, opacity:0.22}));
  group.add(core);
  return group;
}

// Build a ThreeJS object for a node. The central (root) node is rendered as the
// rotating wireframe globe; other nodes are shaded spheres with an outline ring.
// Every node gets an always-visible, distance-independent text label.
function makeNodeObject(d){
  if(typeof window.THREE==="undefined") return null;   // fall back to lib default
  const THREE=window.THREE;
  const group=new THREE.Group();
  const r=nodeRadius(d);

  if(d.isRoot){
    // Central bubble: wireframe globe (meridians/latitudes/axes), self-spinning.
    const R=r*1.7;
    const bubble=makeWireframeSphere(R, nodeColor(d), nodeRingColor(d));
    bubble.userData.spin=true;
    group.add(bubble);
    _spinBubbles.push(bubble);
    // Label sits above the globe.
    const label=makeLabel(d.id.length>12?d.id.slice(0,11)+"…":d.id,
      {color:"#1d281e", textHeight:12, weight:"700"});
    if(label){ label.position.set(0, R+7, 0); group.add(label); _labels.push(label); }
  }else{
    // Regular node: shaded sphere + outline ring (keeps the saved-conflict colors).
    const sphere=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),
      new THREE.MeshLambertMaterial({color:nodeColor(d)}));
    group.add(sphere);
    const ring=new THREE.Mesh(new THREE.SphereGeometry(r*1.14,24,18),
      new THREE.MeshBasicMaterial({color:nodeRingColor(d), transparent:true, opacity:0.3, side:THREE.BackSide}));
    group.add(ring);
    const label=makeLabel(d.id.length>12?d.id.slice(0,11)+"…":d.id,
      {color:"#1d281e", textHeight:10, weight:"600"});
    if(label){ label.position.set(0, r+6, 0); group.add(label); _labels.push(label); }
  }
  return group;
}

// Per-frame loop (3D only): spins the central wireframe globe(s), and rescales
// every label so it keeps a ~constant on-screen size no matter the zoom/distance
// (the robust, non-breaking way to make 3D text readable at any distance).
let _bubbleRAF=null;
const _LABEL_REF_DIST=220;   // camera distance at which labels show at base size
function startBubbleSpin(){
  if(_bubbleRAF) return;
  const tick=()=>{
    if(viewMode==="3d"){
      for(const b of _spinBubbles){ b.rotation.y+=0.012; b.rotation.x=0.45; }
      try{
        const cam = Graph3D && Graph3D.camera && Graph3D.camera();
        if(cam && _labels.length){
          for(const L of _labels){
            if(L.scale.__base===undefined){ L.scale.__base={x:L.scale.x,y:L.scale.y}; }
            // world position of the label
            const wp = L.getWorldPosition ? L.getWorldPosition(new window.THREE.Vector3()) : null;
            if(!wp) continue;
            const dist = cam.position.distanceTo(wp);
            const k = Math.max(0.6, Math.min(3.2, dist/_LABEL_REF_DIST));   // clamp
            L.scale.x = L.scale.__base.x * k;
            L.scale.y = L.scale.__base.y * k;
          }
        }
      }catch(e){/* never let label sizing break the render loop */}
    }
    _bubbleRAF=requestAnimationFrame(tick);
  };
  _bubbleRAF=requestAnimationFrame(tick);
}

function render3D(nodes,links,rootName){
  const host=document.getElementById("graph3d");

  // Lazily create the single persistent ForceGraph3D instance.
  if(!Graph3D){
    if(typeof ForceGraph3D==="undefined"){ console.warn("3d-force-graph not loaded"); return; }
    // Use OrbitControls so the idle auto-rotate (spherical camera orbit) works;
    // the library's default is TrackballControls, which has no autoRotate.
    Graph3D = ForceGraph3D({ controlType:"orbit" })(host)
      .backgroundColor("#f5f0e8")                     // match app theme (light)
      .showNavInfo(false)
      .nodeRelSize(6)
      .nodeVal(d=>d.isRoot?3:1)
      .nodeColor(nodeColor)                           // used if custom object unavailable
      .nodeThreeObject(makeNodeObject)
      .nodeThreeObjectExtend(false)
      .nodeLabel(d=>`${d.id} — ${d.ingredient}`)      // native hover label (backup)
      .linkColor(d=>edgeColor(d.severity))            // severity = COLOR (unchanged)
      .linkWidth(d=>typeWidth(d.type))
      .linkOpacity(0.82)
      .linkHoverPrecision(6)
      .onNodeClick(d=>{ resetIdle(); if(d.isRoot) showInfoCard(d); else buildGraph(d.id); })
      .onLinkClick(d=>{ resetIdle(); showInteractionCard(d); })
      .onNodeDragEnd(d=>{ d.fx=d.x; d.fy=d.y; d.fz=d.z; })   // pin where dropped (like 2D drag)
      .onBackgroundClick(()=>resetIdle());

    // Hover tooltips — reuse the existing rich HTML tooltip.
    Graph3D.onNodeHover((d,prev)=>{
      host.style.cursor=d?"pointer":null;
      if(!d){hideTooltip();return;}
      showTooltipAt(`<b>${d.id}</b><br/><span style="color:#b8d4a8">${d.ingredient}</span><br/>
        <span style="color:#8fbe7c;font-size:.72rem">Click to ${d.isRoot?'see info card':'explore'}</span>`);
    });
    Graph3D.onLinkHover(d=>{
      host.style.cursor=d?"pointer":null;
      if(!d){hideTooltip();return;}
      const a=d.source.id||d.source, b=d.target.id||d.target;
      showTooltipAt(`<b>${a} ↔ ${b}</b><br/>
        <span style="color:#b8d4a8">${d.severity.toUpperCase()} · ${d.type}</span><br/>${d.desc}
        <br/><span style="color:#8fbe7c;font-size:.72rem">Click line for full details</span>`);
    });

    // ── Physics ported from the 2D version onto the d3-force-3d engine ──────────
    //    (same charge / link distance+strength / collide, and decay constants,
    //     now solving in 3 dimensions so the layout is a spherical cloud).
    Graph3D.numDimensions(3)
      .d3VelocityDecay(0.55)                          // was velocityDecay(0.55)
      .d3AlphaDecay(0.03)                             // was alphaDecay(0.03)
      .cooldownTime(Infinity)                         // keep gentle motion alive for idle orbit
      .warmupTicks(0);
    Graph3D.d3Force("charge").strength(-480);
    Graph3D.d3Force("link").distance(175).strength(0.55);
    // (The strong charge force keeps the 3D spheres well separated; we avoid
    //  injecting a 2D d3.forceCollide here since the engine is d3-force-3d.)

    // Track hover position for the HTML tooltip.
    host.addEventListener("mousemove",e=>{ _mx=e.clientX; _my=e.clientY; if(tt.style.display==="block"){tt.style.left=(_mx+14)+"px";tt.style.top=(_my-10)+"px";} });
  }

  // ── Position cache (3D space): carry nodes over so rebuilds animate from
  //    their last 3D position. Kept separate from the 2D cache so toggling
  //    modes never mixes screen coords with 3D-space coords. ──
  nodes.forEach(n=>{
    if(posCache3D[n.id]){ n.x=posCache3D[n.id].x; n.y=posCache3D[n.id].y; n.z=posCache3D[n.id].z; }
    if(n.isRoot){ n.fx=0; n.fy=0; n.fz=0; }           // pin root at scene center
  });

  // New scene → drop references to the previous scene's bubbles & labels.
  _spinBubbles=[];
  _labels=[];

  // Fade the canvas during a data swap (preserves the old cross-fade feel).
  host.style.opacity="0.15";
  Graph3D.graphData({nodes, links});
  setTimeout(()=>{ host.style.opacity="1"; }, 120);
  startBubbleSpin();

  // Cache 3D positions as the engine ticks.
  Graph3D.onEngineTick(()=>{
    (Graph3D.graphData().nodes||[]).forEach(n=>{ posCache3D[n.id]={x:n.x,y:n.y,z:n.z}; });
  });

  // Release the root after the spring settles so the cloud can drift (as before).
  setTimeout(()=>{
    const r=(Graph3D.graphData().nodes||[]).find(n=>n.isRoot);
    if(r){ r.fx=null; r.fy=null; r.fz=null; }
  },1200);

  // Frame the scene, then resume the spherical idle orbit.
  Graph3D.zoomToFit(600, 60);
  startRotation();
}

// ─── INFO CARDS (dynamic vertical stack) ───────────────────────────────────────
// The panel holds an ordered stack of cards. Each card is an object
// {id, html, size}. size is the user-dragged flex-basis in px (null = auto/even).
// Cards render top→bottom with a draggable divider between each adjacent pair,
// and every card carries its own ✕ Close button.
let cardStack = [];

// External-link ("arrow out of box") icon markup, replacing the old 📎.
function extIcon(){
  return `<svg class="ext-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>`;
}
function srcLink(href,label){
  return `<a class="src-link" href="${href}" target="_blank" rel="noopener">${label} ${extIcon()}</a>`;
}

function renderPanel(){
  const panel=document.getElementById("info-panel");
  if(!cardStack.length){ panel.style.display="none"; panel.innerHTML=""; return; }
  panel.style.display="flex";
  panel.innerHTML="";
  cardStack.forEach((card,i)=>{
    if(i>0){
      const dv=document.createElement("div");
      dv.className="card-divider"; dv.title="Drag to resize";
      dv.dataset.above=cardStack[i-1].id; dv.dataset.below=card.id;
      dv.addEventListener("mousedown",startDividerDrag);
      panel.appendChild(dv);
    }
    const el=document.createElement("div");
    el.className="info-card"; el.id="card-"+card.id;
    el.innerHTML=card.html;
    // Respect a user-dragged size if present; otherwise share space evenly.
    el.style.flex = card.size!=null ? `0 0 ${card.size}px` : "1 1 0";
    panel.appendChild(el);
  });
}

function openCard(id, html){
  const existing=cardStack.find(c=>c.id===id);
  if(existing){ existing.html=html; }
  else { cardStack.push({id, html, size:null}); }
  // Opening/closing resets any manual sizing so the new set shares evenly.
  cardStack.forEach(c=>c.size=null);
  renderPanel();
}
function closeCard(id){
  cardStack=cardStack.filter(c=>c.id!==id);
  cardStack.forEach(c=>c.size=null);
  renderPanel();
}
function clearCards(){ cardStack=[]; renderPanel(); }

// Divider drag — resizes the two adjacent cards it sits between.
let _drag=null;
function startDividerDrag(e){
  e.preventDefault();
  const dv=e.currentTarget;
  const aboveEl=document.getElementById("card-"+dv.dataset.above);
  const belowEl=document.getElementById("card-"+dv.dataset.below);
  _drag={aboveId:dv.dataset.above, belowId:dv.dataset.below,
         startY:e.clientY, aboveH:aboveEl.offsetHeight, belowH:belowEl.offsetHeight};
  document.body.style.cursor="row-resize";
}
document.addEventListener("mousemove",e=>{
  if(!_drag)return;
  const dy=e.clientY-_drag.startY;
  const min=70;
  let newAbove=_drag.aboveH+dy, newBelow=_drag.belowH-dy;
  if(newAbove<min){ newBelow-=(min-newAbove); newAbove=min; }
  if(newBelow<min){ newAbove-=(min-newBelow); newBelow=min; }
  const a=cardStack.find(c=>c.id===_drag.aboveId), b=cardStack.find(c=>c.id===_drag.belowId);
  if(a)a.size=newAbove; if(b)b.size=newBelow;
  const aEl=document.getElementById("card-"+_drag.aboveId), bEl=document.getElementById("card-"+_drag.belowId);
  if(aEl)aEl.style.flex=`0 0 ${newAbove}px`;
  if(bEl)bEl.style.flex=`0 0 ${newBelow}px`;
});
document.addEventListener("mouseup",()=>{if(_drag){_drag=null;document.body.style.cursor="";}});

// ─── DRUGS.COM PHOTO GALLERY ───────────────────────────────────────────────────
// Maps a brand/alt name to the Drugs.com image page that shows its pill/packaging
// photos, plus a thumbnail. Drugs.com hotlink-protects images, so each tile links
// to the real Drugs.com page and the thumbnail falls back to a labeled placeholder
// if the remote image can't load — the hyperlink always works.
function drugsComSlug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}
function drugsComImagePage(name){
  return `https://www.drugs.com/image/${drugsComSlug(name)}-images.html`;
}
function drugsComThumb(name){
  // Drugs.com image search thumbnail endpoint (falls back via onerror if blocked).
  return `https://www.drugs.com/images/pills/custom/search.jpg?q=${encodeURIComponent(name)}`;
}
// A single gallery tile: hyperlinked image + caption (brand + what it is).
function galleryTile(brand, ingredient, cls, isPrimary){
  const page=drugsComImagePage(brand);
  const thumb=drugsComThumb(brand);
  const sub = isPrimary ? (cls||ingredient) : `${cls||""}${cls&&ingredient?" · ":""}${ingredient||""}`;
  const safeBrand=brand.replace(/'/g,"&#39;");
  const fallback=`<div class="gthumb-fallback"><span>${safeBrand}<br/><span style="font-size:.62rem">photo on Drugs.com ${extIcon()}</span></span></div>`;
  return `<a class="gphoto" href="${page}" target="_blank" rel="noopener" title="View ${safeBrand} photos on Drugs.com">
      <img class="gthumb" src="${thumb}" alt="${safeBrand} packaging / pill"
           onerror="this.outerHTML='${fallback.replace(/'/g,"&#39;").replace(/"/g,'&quot;')}'"/>
      <div class="gcap"><b>${safeBrand}</b><br/><span class="gcap-sub">${sub}</span></div>
    </a>`;
}
function galleryHTML(drug){
  // Primary brand first, then each alternative name (same medication, other brands).
  const alts=(drug.similar||[]).slice().sort();
  const tiles=[ galleryTile(drug.id, drug.ingredient, drug.cls, true),
                ...alts.map(name=>galleryTile(name, drug.ingredient, drug.cls, false)) ].join("");
  return `
      <div class="card-section-title">Photos — Pill &amp; Packaging <span style="text-transform:none;font-weight:400;color:#8a7e6a">(Drugs.com)</span></div>
      <div class="gallery">${tiles}</div>`;
}

// Builds the shared drug-card markup (same visual format for every drug card).
function drugCardHTML(drug){
  const rels=ALL_INTERACTIONS
    .filter(e=>e.source===drug.id||e.target===drug.id)
    .sort((a,b)=>({severe:0,moderate:1,mild:2}[a.severity]-({severe:0,moderate:1,mild:2}[b.severity])));

  const similarHTML=(drug.similar||[]).sort()
    .map(s=>`<span class="similar-chip" title="Same ingredient: ${drug.ingredient}">${s}</span>`).join("");

  return `
    <div class="card-top-bar">
      <button class="close-panel-btn-top" onclick="closeCard('drug-${drug.id}')">✕ Close</button>
    </div>
    <div class="card-header">
      <div class="card-brand">
        ${drug.id}
        <button class="pronunc-btn" onclick="pronounce('${drug.pronounce||drug.id}')" title="Pronounce ${drug.id}">
          🔊 ${drug.pronounce||drug.id}
        </button>
      </div>
      <div class="card-class">${drug.cls}</div>
    </div>
    <div class="card-body">
      <div class="card-section-title">Active Ingredient</div>
      <div class="ingredient-row">
        <span class="card-val">${drug.ingredient}</span>
        <button class="pronunc-btn ingredient" onclick="pronounce('${drug.ingredient.replace(/'/g,"\\'")}')" title="Pronounce ${drug.ingredient}">
          🔊 Pronounce
        </button>
      </div>

      <div class="card-section-title">Description</div>
      <div class="card-val">${drug.desc}<br/>
        ${srcLink(drug.citation,"NLM Source")}
      </div>

      ${galleryHTML(drug)}

      <div class="card-section-title">Same Medication — Other Brand Names</div>
      <div style="margin-top:4px">${similarHTML||'<span style="color:#8a7e6a;font-size:.8rem">None listed</span>'}</div>

      <div class="card-section-title">
        Negative Interactions
        <span style="background:#c0392b22;color:#c0392b;border:1px solid #c0392b55;border-radius:8px;padding:1px 7px;font-size:.68rem;margin-left:6px">${rels.length}</span>
      </div>
      <div class="icard-list${rels.length>3?' scroll':''}">
      ${rels.map(r=>{
        const other=r.source===drug.id?r.target:r.source;
        return `<div class="icard ${r.severity}">
          <div class="ic-title">
            <span style="cursor:pointer;color:#4a6741;font-weight:600" onclick="buildGraph('${other}')">${other}</span>
            <span class="ic-badge ${r.severity}">${r.severity}</span>
            <span style="color:#7a6e5a;font-size:.7rem;margin-left:auto">${r.type}</span>
          </div>
          <div class="ic-sub">${r.desc}<br/>
            ${srcLink(r.citation,"View source")}
          </div>
        </div>`;
      }).join("")}
      </div>
    </div>`;
}

// Open a drug info card (keyed by drug id so it won't duplicate).
function showInfoCard(drug){
  openCard("drug-"+drug.id, drugCardHTML(drug));
}

// Interaction card — same structural format as drug cards, describing the A↔B
// interaction. Keyed by the (ordered) pair so it's unique in the stack.
function interactionCardHTML(link){
  const a=link.source.id||link.source;
  const b=link.target.id||link.target;
  const sevColor=link.severity==="severe"?"#c0392b":link.severity==="moderate"?"#d48600":"#27ae60";
  const da=ALL_DRUGS[a]||{}, db=ALL_DRUGS[b]||{};
  const id=interactionId(link);
  return `
    <div class="card-top-bar">
      <button class="close-panel-btn-top" onclick="closeCard('${id}')">✕ Close</button>
    </div>
    <div class="card-header">
      <div class="card-brand" style="font-size:.98rem">
        ${a} <span style="color:#7a6e5a">↔</span> ${b}
      </div>
      <div class="card-class">
        <span class="ic-badge ${link.severity}" style="margin-right:6px">${link.severity}</span>
        ${link.type} interaction
      </div>
    </div>
    <div class="card-body">
      <div class="card-section-title">Severity</div>
      <div class="card-val"><span style="color:${sevColor};font-weight:700">${link.severity.toUpperCase()}</span></div>

      <div class="card-section-title">Interaction Type</div>
      <div class="card-val">${link.type}</div>

      <div class="card-section-title">Drugs Involved</div>
      <div style="margin-top:4px">
        <span class="similar-chip" title="${da.ingredient||''}" onclick="buildGraph('${a}')">${a}${da.ingredient?' — '+da.ingredient:''}</span>
        <span class="similar-chip" title="${db.ingredient||''}" onclick="buildGraph('${b}')">${b}${db.ingredient?' — '+db.ingredient:''}</span>
      </div>

      <div class="card-section-title">What Happens</div>
      <div class="card-val">${link.desc}<br/>
        ${srcLink(link.citation,"View source")}
      </div>
    </div>`;
}
function interactionId(link){
  const a=link.source.id||link.source, b=link.target.id||link.target;
  return "inter-"+a+"-"+b;
}
function showInteractionCard(link){
  openCard(interactionId(link), interactionCardHTML(link));
}

// ─── TOOLTIP ──────────────────────────────────────────────────────────────────
const tt=document.getElementById("tooltip");
let _mx=0,_my=0;   // last pointer position (for the 3D hover tooltip)
document.addEventListener("mousemove",e=>{_mx=e.clientX;_my=e.clientY;});
function showTooltip(event,html){tt.innerHTML=html;tt.style.display="block";tt.style.left=(event.pageX+14)+"px";tt.style.top=(event.pageY-10)+"px";}
// Position-agnostic variant used by the WebGL hover handlers (no DOM event).
function showTooltipAt(html){tt.innerHTML=html;tt.style.display="block";tt.style.left=(_mx+14)+"px";tt.style.top=(_my-10)+"px";}
function hideTooltip(){tt.style.display="none";}

// ─── SEARCH ───────────────────────────────────────────────────────────────────
function searchInteraction(){
  const d1=document.getElementById("drug1").value.trim();
  const d2=document.getElementById("drug2").value.trim();
  const sr=document.getElementById("search-result");
  const srTitle=document.getElementById("sr-title"),srBody=document.getElementById("sr-body");

  if(!d1||!d2){srTitle.textContent="Enter both drug names";srBody.textContent="";sr.style.display="block";return;}

  // Any entered name that is neither in our list nor resolvable to a DB drug is
  // "unknown". Prompt to add each unknown name to the list, then re-run search.
  const unknown=[d1,d2].filter(n=>!isKnownDrugName(n)&&!resolveDrugName(n));
  if(unknown.length){
    // Prompt sequentially for each unknown name, then retry the search once done.
    (async()=>{ for(const n of unknown){ await confirmAddDrug(n); } searchInteraction(); })();
    return;
  }

  // Resolve alternative brand names / ingredients to canonical drug keys so that
  // e.g. "Coumadin" (a brand of Warfarin) or "Motrin" (Advil) pull up the graph.
  const key1=resolveDrugName(d1), key2=resolveDrugName(d2);
  const isAlt1 = key1 && key1.toLowerCase()!==d1.toLowerCase();  // entered an alternative name
  const isAlt2 = key2 && key2.toLowerCase()!==d2.toLowerCase();
  const anyAlt = isAlt1 || isAlt2;

  const match=(key1&&key2)?ALL_INTERACTIONS.find(e=>
    (e.source===key1&&e.target===key2)||(e.source===key2&&e.target===key1)
  ):null;

  // When either entered name is an alternative (not a direct DB hit), clear the
  // panel and surface the equivalent DB cards so the user sees the equivalence:
  //  • the drug card for each searched drug we recognize
  //  • the interaction card between the two (in our DB names), if one exists
  //  • if BOTH names are alternatives, both drug cards are shown
  if(anyAlt){
    clearCards();
    // 1 & 3: show the canonical drug card for each name the user entered as an
    //        ALTERNATIVE — that's where the equivalence needs to be revealed.
    //        If both names were alternatives, both drug cards are shown.
    //        (A name typed exactly as our DB name needs no equivalence card.)
    const toShow=[];
    if(isAlt1) toShow.push(key1);
    if(isAlt2 && key2!==key1) toShow.push(key2);
    toShow.forEach(k=>{ if(ALL_DRUGS[k]) showInfoCard(Object.assign({id:k}, ALL_DRUGS[k])); });
    // 2: interaction card between the two searched drugs, if they interact.
    if(match) showInteractionCard(match);
    // Center the graph on the first resolved drug for context.
    buildGraph(key1||key2, true);
  }

  if(match){
    const col=match.severity==="severe"?"#c0392b":match.severity==="moderate"?"#d48600":"#27ae60";
    const noteA = isAlt1 ? ` <span style="color:#7a6e5a;font-size:.78rem">(you typed “${d1}”)</span>`:"";
    const noteB = isAlt2 ? ` <span style="color:#7a6e5a;font-size:.78rem">(you typed “${d2}”)</span>`:"";
    srTitle.innerHTML=`${match.source} ↔ ${match.target}`;
    srBody.innerHTML=`<span style="color:${col};font-weight:700">${match.severity.toUpperCase()}</span> · ${match.type}${noteA}${noteB}<br/><br/>
      ${match.desc}<br/>${srcLink(match.citation,"View source")}`;
    if(history[history.length-1]!==`${d1}+${d2}`)history.push(`${d1}+${d2}`);
    if(!anyAlt) buildGraph(match.source);
  }else{
    srTitle.textContent="No interaction found";
    const shown1=key1?`<b>${key1}</b>${isAlt1?` (“${d1}”)`:""}`:`<b>${d1}</b>`;
    const shown2=key2?`<b>${key2}</b>${isAlt2?` (“${d2}”)`:""}`:`<b>${d2}</b>`;
    srBody.innerHTML=`No recorded interaction between ${shown1} and ${shown2} in ODMAP.`;
    if(!anyAlt){ if(key1)buildGraph(key1); else if(key2)buildGraph(key2); }
  }
  sr.style.display="block";
}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(document.activeElement.id==="drug1"||document.activeElement.id==="drug2"))searchInteraction();});

// ─── AUTOCOMPLETE WIRING ───────────────────────────────────────────────────────
// Attach the alphabetical, narrowing dropdown to both search inputs and the
// saved-list input. Picking a suggestion just fills the field; the user can
// still type a full name and press Go / Add / Enter.
attachAutocomplete(document.getElementById("drug1"), ()=>{});
attachAutocomplete(document.getElementById("drug2"), ()=>{});
attachAutocomplete(document.getElementById("saved-input"), ()=>{});

// ─── INIT ─────────────────────────────────────────────────────────────────────
// Coordinate the first render with the async ES-module loading of the 3D libs.
//  • Default mode is 3D. If the libs are ready, we render 3D immediately.
//  • If they're still loading, buildGraph() renders a 2D interim view, then we
//    upgrade to 3D the moment the libs finish loading.
//  • If they fail to load, we lock to 2D (toggle's 3D button is disabled).
function finalizeGraphLibs(){
  if(window.__force3DUnavailable){
    forceFallbackTo2D();
    buildGraph(currentRoot,true);
  }else if(viewMode==="3d" && typeof ForceGraph3D!=="undefined"){
    // (Re)build in real 3D now that the libraries are available.
    document.getElementById("graph3d").style.display="block";
    document.getElementById("graph2d").style.display="none";
    buildGraph(currentRoot,true);
  }
}
document.addEventListener("graphlibsready", finalizeGraphLibs);

window.onload = ()=>{
  buildGraph("Warfarin");                 // renders now (2D interim if libs pending)
  if(window.__graphLibsReady) finalizeGraphLibs();   // libs already settled? upgrade now
  // Safety net: if the libs never signal readiness within 8s, ensure 2D is shown.
  setTimeout(()=>{ if(!window.__graphLibsReady){ forceFallbackTo2D(); buildGraph(currentRoot,true); } }, 8000);
};
// The 3D graph auto-resizes to its container; the 2D graph fills its SVG host.
// Keep the 3D camera framed on resize (no physics restart needed).
window.onresize= ()=>{ if(viewMode==="3d" && Graph3D && Graph3D.zoomToFit) Graph3D.zoomToFit(400,60); };
</script>
